[project]
name = "dash-typed-callbacks"
version = "0.1.0"
description = "Type-safe, readable Dash callbacks with named fields instead of messy return values."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["dash>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dash_typed_callbacks"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0",
    "pytest-cov>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "dash_integration: tests that create a real Dash app (may be slow or need extra deps)",
]
